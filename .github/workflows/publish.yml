name: Build tracker and deploy

on:
  schedule:
    # All times UTC. 15-minute refresh through the game windows, every 3 hours otherwise.
    # (GitHub cron is best-effort and can start a few minutes late under load.)
    - cron: "0 */3 * * *"          # baseline: picks PDFs (posted any day) + stragglers
    - cron: "*/15 23 * * 4"        # Thu night game: 7pm ET kickoff is 23:15-00:15 UTC
    - cron: "*/15 0-4 * * 5"       #   ... through ~11:30pm ET
    - cron: "*/15 13-23 * * 0"     # Sunday: London 9:30am ET through the late window
    - cron: "*/15 0-4 * * 1"       #   ... Sunday night game ends ~midnight ET
    - cron: "*/15 23 * * 1"        # Monday night game
    - cron: "*/15 0-4 * * 2"       #   ... through ~11:30pm ET
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:  # build + tests only, never deploys

permissions:
  contents: read
  id-token: write  # keyless auth to Google Cloud (Workload Identity Federation)

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Today's date (cache key)
        id: day
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4  # one save per day; later runs restore it and skip saving
        with:
          path: |
            data/picks
            data/results
          key: circa-store-${{ steps.day.outputs.d }}
          restore-keys: circa-store-
      - run: uv sync --group dev

      - name: Tests
        run: uv run --group dev pytest -q

      - name: Fetch picks + results, check they reconcile
        if: github.event_name != 'pull_request'
        run: uv run circa reconcile

      - name: Export site data
        if: github.event_name != 'pull_request'
        run: uv run circa export

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web

      - name: Authenticate to Google Cloud
        if: github.event_name != 'pull_request' && vars.GCP_PROJECT_ID != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Deploy to Firebase Hosting
        if: github.event_name != 'pull_request' && vars.GCP_PROJECT_ID != ''
        run: npx --yes firebase-tools@13 deploy --only hosting --project "${{ vars.GCP_PROJECT_ID }}" --non-interactive
