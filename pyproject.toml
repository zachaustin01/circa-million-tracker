[project]
name = "circa"
version = "0.1.0"
description = "Live tracker for the Circa Sports Million football contest"
requires-python = ">=3.11,<3.14"
dependencies = ["requests", "pyarrow", "pdfplumber"]

[project.scripts]
circa = "circa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/circa"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
